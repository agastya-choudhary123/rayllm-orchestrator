# One-click local serving.
#   docker compose up                 (CPU host)
#   docker compose --profile gpu up   (GPU host -> real vLLM)
services:
  serve:
    build: .
    command: ["serve", "--model", "./checkpoints/phi-3", "--quant", "4bit",
              "--continuous-batching", "--port", "8000", "--host", "0.0.0.0"]
    ports: ["8000:8000"]
    volumes: ["./checkpoints:/app/checkpoints"]

  # GPU serving variant -- enable with `--profile gpu`.
  serve-gpu:
    profiles: ["gpu"]
    build:
      context: .
    command: ["serve", "--model", "./checkpoints/phi-3", "--quant", "4bit",
              "--tensor-parallel", "2", "--port", "8000", "--host", "0.0.0.0"]
    ports: ["8000:8000"]
    volumes: ["./checkpoints:/app/checkpoints"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
