[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayllm-orchestrator"
version = "0.3.2"
description = "Fine-tune and serve small LLMs on your laptop"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Agastya Choudhary", email = "agastya.r.choudhary@gmail.com"},
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "accelerate>=0.33",
    "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
quantize = ["bitsandbytes>=0.43"]
# backends_mlx.is_available() requires BOTH mlx and mlx-lm; psutil backs the
# memory guard in set_memory_guard().
mlx = ["mlx>=0.18", "mlx-lm>=0.18", "psutil>=5.9"]
llama-cpp = ["llama-cpp-python>=0.2"]
ollama = ["ollama>=0.1"]

[project.scripts]
rayllm = "orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/agastya-choudhary123/rayllm-orchestrator"
Repository = "https://github.com/agastya-choudhary123/rayllm-orchestrator"

[tool.setuptools]
packages = ["orchestrator"]
py-modules = []
