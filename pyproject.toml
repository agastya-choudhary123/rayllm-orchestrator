[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayllm-orchestrator"
version = "0.1.0"
description = "Train and serve LLMs on any hardware with one command each"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Agastya Choudhary", email = "agastya.r.choudhary@gmail.com"},
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "accelerate>=0.33",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = [
    "ray[default]>=2.35",
    "vllm>=0.6.0",
    "bitsandbytes>=0.43",
]
mlx = ["mlx>=0.18"]

[project.scripts]
rayllm = "orchestrator.cli:main"

[project.urls]
Homepage = "https://github.com/agastya-choudhary123/rayllm-orchestrator"
Repository = "https://github.com/agastya-choudhary123/rayllm-orchestrator"

[tool.setuptools]
packages = ["orchestrator"]
py-modules = []
